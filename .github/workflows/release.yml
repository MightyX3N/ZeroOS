# Builds ZeroOS for Intel/AMD and ARM and publishes a GitHub release when a tag like v0.1.0 is pushed.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go vet ./... && go test ./...
      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/MightyX3N/zeroos/internal/core.Version=${GITHUB_REF_NAME#v}" \
              -o dist/zeroos-linux-$arch ./cmd/zeroos
          done
          cd dist && sha256sum zeroos-linux-* > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "ZeroOS ${GITHUB_REF_NAME#v}" --generate-notes
